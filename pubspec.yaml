name: flanb
description: A cross-platform Dart CLI tool to build Flutter Android APKs and serve them over your local network (LAN) for quick device testing.
version: 0.2.1
repository: https://github.com/nirmalyohannan/flanb
homepage: https://github.com/nirmalyohannan/flanb

environment:
  sdk: '>=3.0.0 <4.0.0'

executables:
  flanb: flanb

dependencies:
  args: ^2.7.0
  path: ^1.9.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.6

